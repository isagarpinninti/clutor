name: npm release
# Push a tag such as v0.1.0 (matching the packages' version) to publish @clutor/core and @clutor/cli with provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run engine
      - run: npm run engine:test
      - run: npm run engine:golden
      # The chat protocol the terminal UI uses, on every architecture, against the engine's own greedy decoding.
      - run: npm run engine:chat
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run smoke
      - name: Check the tag matches the package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in core cli; do
            actual=$(node -p "require('./packages/$p/package.json').version")
            [ "$actual" = "$v" ] || { echo "packages/$p is $actual, tag is $v"; exit 1; }
          done
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Publish (core first; cli depends on it). A package whose version is already on npm is skipped, so re-running a release does not fail.
        run: |
          for p in core cli; do
            name="@clutor/$p"
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v is already published; skipping"
            else
              npm publish -w "$name" --access public --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
