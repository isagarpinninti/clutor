name: CI
on:
  push:
    branches: [main, "portable/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run engine
      - run: npm run engine:test
      # An independent pure-Python forward pass checks the engine on every kernel path this runner compiles (AVX2 on Linux x86, NEON on macOS arm64).
      - run: npm run engine:golden
      # The chat protocol the terminal UI uses, on every architecture, against the engine's own greedy decoding.
      - run: npm run engine:chat
      # The batched prompt path equals token-by-token stepping on every architecture, mapped and streamed, at several batch sizes.
      - run: npm run engine:prefill
      # A model that does not fit in memory streams its experts by itself; a dense one refuses and says why.
      - run: npm run engine:autostream
      # @clutor/cli type-checks against the built @clutor/core, so build first.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm test -w @clutor/relay
      - run: npm run smoke
      - run: npm run bench
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'

  # The desktop app on every system it ships for. It compiles the C engine into the program, runs the app's own tests and the Rust tests, and builds the program itself, so a
  # break on Windows or Linux shows up here and not on a user's machine. (Windows compiles the engine with clang-cl; plat.h supplies the few pthread calls it needs.)
  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC_x86_64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System libraries for the web view (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev libxdo-dev build-essential
      - name: Compiler for the engine (Windows)
        if: runner.os == 'Windows'
        run: clang-cl --version
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: cargo test --lib
        working-directory: app/src-tauri
      # The image engine (stable-diffusion.cpp) is built from a pinned revision and linked into the program. If it cannot be built here the program is still built, without it.
      - name: Cache the image engine
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/clutor-sd
          key: sd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-sd.sh') }}
      - name: Build the image engine
        id: sd
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: scripts/build-sd.sh
      - name: Report the image engine
        shell: bash
        run: if [ "${{ steps.sd.outcome }}" = "success" ]; then echo "::notice::image engine built"; else echo "::warning::the image engine could not be built here; the program is built without it"; fi
      - name: Build the program (no installer)
        run: npx tauri build --debug --no-bundle
        working-directory: app
        env:
          CLUTOR_SD_DIR: ${{ steps.sd.outputs.dir }}

  sanitizers:
    name: Engine under ASan, UBSan and TSan (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate a small MoE test file
        run: node -e "import('@clutor/core/node').then(m=>m.writeSyntheticGguf('/tmp/small.gguf',{arch:'qwen2moe',name:'small-moe',layers:6,embedding:256,heads:8,kvHeads:4,contextLength:2048,expertCount:32,expertsUsed:4,expertFfn:256,denseFfn:0,vocab:1024,sharedExperts:0}))"
      - run: make -C c sanitize SMALL=/tmp/small.gguf
      - name: Fuzz the file readers (corrupted models must give errors, never crashes or hangs)
        run: make -C c fuzz

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependencies must have no known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  # The engine built with MinGW-w64 on Windows: the unit checks, the golden test against the independent reference, and the chat protocol.
  engine-windows:
    name: Engine (Windows, MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
      - run: make -C c
      - run: make -C c test
      - run: make -C c golden
      - run: make -C c chat-test

