<!doctype html>
<html lang="en" data-theme="dark" style="background:#080c1c">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080c1c" />
    <script>try{var p=localStorage.getItem("clutor-theme")||"dark";var t=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;var r=document.documentElement;r.dataset.theme=t;r.style.background=t==="dark"?"#080c1c":"#ffffff"}catch(e){}</script>
    <title>Clutor</title>
    <link rel="icon" type="image/svg+xml" href="/clutor-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
