[package]
name = "clutor-app"
version = "0.4.0"
description = "Clutor: chat with large models on your own machine, on Clutor's own engine."
authors = ["Sagar Pinninti"]
edition = "2021"
license = "MIT"

[lib]
name = "clutor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
regex = "1"
snow = "0.9"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
if-addrs = "0.13"
keepawake = "0.5"
hostname = "0.4"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "process", "sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
